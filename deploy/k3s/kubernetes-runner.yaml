apiVersion: v1
kind: ServiceAccount
metadata:
  name: chetter-runner
  namespace: chetter
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chetter-agent
  namespace: chetter
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chetter-runner
  namespace: chetter
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/attach"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chetter-runner
  namespace: chetter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chetter-runner
subjects:
  - kind: ServiceAccount
    name: chetter-runner
    namespace: chetter
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chetter-runner
  namespace: chetter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chetter-runner
  template:
    metadata:
      labels:
        app: chetter-runner
    spec:
      # Single-node k3s only: runner and child Pods must see the same hostPath.
      terminationGracePeriodSeconds: 90
      serviceAccountName: chetter-runner
      containers:
        - name: runner
          image: ghcr.io/flatout-works/chetter-runner:main
          envFrom:
            - secretRef:
                name: chetter-secrets
          env:
            - name: CHETTER_SERVER_URL
              value: http://chetter-mcp:8080
            - name: EXECUTION_BACKEND
              value: kubernetes
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: RUNNER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KUBERNETES_RUNTIME_CLASS
              value: gvisor
            - name: KUBERNETES_AGENT_SERVICE_ACCOUNT
              value: chetter-agent
            - name: KUBERNETES_WORKSPACE_HOST_PATH
              value: /var/lib/chetter-runner/workspaces
            - name: KUBERNETES_AGENT_IMAGE_PULL_POLICY
              value: IfNotPresent
            - name: RUNNER_MAX_CONCURRENT
              value: "1"
            - name: CHETTER_DRAIN_TIMEOUT_SEC
              value: "60"
            - name: CHETTER_DRAIN_HARD_KILL_TIMEOUT_SEC
              value: "30"
          volumeMounts:
            - name: workspaces
              mountPath: /var/lib/chetter-runner/workspaces
      volumes:
        - name: workspaces
          hostPath:
            path: /var/lib/chetter-runner/workspaces
            type: DirectoryOrCreate
