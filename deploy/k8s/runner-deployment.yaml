apiVersion: apps/v1
kind: Deployment
metadata:
  name: chetter-runner
  namespace: chetter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chetter-runner
  template:
    metadata:
      labels:
        app: chetter-runner
    spec:
      terminationGracePeriodSeconds: 90
      serviceAccountName: chetter-runner
      containers:
      - name: runner
        image: ghcr.io/flatout-works/chetter-runner:main
        envFrom:
        - secretRef:
            name: chetter-secrets
        env:
        - name: CHETTER_SERVER_URL
          value: "http://chetter-mcp:8080"
        - name: CHETTER_RUNNER_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: chetter-secrets
              key: CHETTER_RUNNER_RPC_TOKEN
        - name: EXECUTION_BACKEND
          value: "kubernetes"
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: RUNNER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: KUBERNETES_RUNTIME_CLASS
          value: "gvisor"
        - name: KUBERNETES_AGENT_SERVICE_ACCOUNT
          value: "chetter-agent"
        - name: KUBERNETES_WORKSPACE_PVC
          value: "chetter-runner-workspaces"
        - name: KUBERNETES_AGENT_IMAGE_PULL_POLICY
          value: "Always"
        - name: RUNNER_MAX_CONCURRENT
          value: "2"
        - name: CHETTER_DRAIN_TIMEOUT_SEC
          value: "60"
        - name: CHETTER_DRAIN_HARD_KILL_TIMEOUT_SEC
          value: "30"
        volumeMounts:
        - name: runner-data
          mountPath: /var/lib/chetter-runner/workspaces
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
      volumes:
      - name: runner-data
        persistentVolumeClaim:
          claimName: chetter-runner-workspaces
