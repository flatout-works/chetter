# yaml-language-server: $schema=../schemas/runner.schema.json
server:
  url: http://host.docker.internal:8080
  auth_token: ""

runner:
  workspace_root: /var/lib/runner
  max_concurrent: 10
  # Self-preservation (issue #397): pause claiming while free host memory is
  # below 1024 MiB; set CHETTER_MIN_FREE_HOST_MEMORY_MB=0 to disable. Load gating
  # is opt-in (0 = disabled) because it depends on host core count.
  min_free_host_memory_mb: 1024
  max_host_load: 0

proxy:
  listen_addr: :18080
  allowed_domains:
    - api.openai.com
    - api.anthropic.com
    - api.deepseek.com
    - opencode.ai
    - api.synthetic.new
    - api.groq.com
    - api.mistral.ai
    - html.duckduckgo.com
    - lite.duckduckgo.com
    - www.google.com
    - bing.com
    - github.com
    - raw.githubusercontent.com
    - objects.githubusercontent.com
    - docs.python.org
    - pkg.go.dev
    - developer.mozilla.org
    - api.mem9.ai
    - api.osv.dev
    - registry.npmjs.org
    - npmjs.org
  blocked_domains:
    - webhook.site
    - requestbin.com
    - paste.opendev.org
    - pastebin.com
    - discord.com
    - hooks.slack.com
    - zpr.io

dns:
  listen_addr: :53
  upstream: 8.8.8.8:53
  blocked_domains:
    - metadata.google.internal
    - instance-data
    - 169.254.169.254

workspace: {}

git:
  ssh_key_path: ""
  pat: ""

chetter_mcp:
  url: ""
  auth_token: ""
